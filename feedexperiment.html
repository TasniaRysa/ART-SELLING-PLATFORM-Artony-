<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; }

    .page {
      min-height: 100vh;
      background: rgba(120, 162, 179, 0.7);
      position: relative;
      overflow: hidden;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      pointer-events: none;
    }
    .blob-1 { width: 320px; height: 320px; background: rgba(134,88,209,0.18); top: 60px; left: -80px; }
    .blob-2 { width: 260px; height: 260px; background: rgba(255,255,255,0.12); top: 200px; right: -60px; }
    .blob-3 { width: 200px; height: 200px; background: rgba(120,162,179,0.25); bottom: 80px; left: 40%; }

    .navbar {
      background: #8658d1;
      padding: 0 20px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }

    .nav-left { display: flex; align-items: center; gap: 14px; }

    .hamburger-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 8px;
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: #fff;
      font-size: 18px;
      transition: background 0.2s;
      position: relative;
    }
    .hamburger-btn:hover { background: rgba(255,255,255,0.2); }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: 44px; left: 0;
      background: #fff;
      border: 0.5px solid rgba(0,0,0,0.1);
      border-radius: 10px;
      min-width: 180px;
      padding: 6px 0;
      box-shadow: 0 8px 24px rgba(134,88,209,0.13);
      z-index: 100;
    }
    .hamburger-btn.open .dropdown-menu { display: block; }
    .dropdown-menu a {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 16px;
      font-size: 13.5px;
      color: #333;
      text-decoration: none;
      transition: background 0.15s;
    }
    .dropdown-menu a:hover { background: rgba(134,88,209,0.07); }
    .dropdown-menu a i { font-size: 16px; color: #8658d1; }

    .nav-brand {
      font-size: 16px;
      font-weight: 500;
      color: #fff;
      letter-spacing: 0.3px;
    }

    .nav-right { display: flex; align-items: center; gap: 10px; }

    .notif-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 8px;
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: #fff;
      font-size: 17px;
      position: relative;
    }
    .notif-dot {
      width: 7px; height: 7px;
      background: #ff6b6b;
      border-radius: 50%;
      position: absolute;
      top: 6px; right: 6px;
      border: 1.5px solid #8658d1;
    }

    .profile-btn {
      display: flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 10px;
      padding: 4px 10px 4px 4px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .profile-btn:hover { background: rgba(255,255,255,0.22); }
    .avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, #c7a7f5, #8658d1);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 500; color: #fff;
    }
    .profile-name { font-size: 13px; color: #fff; font-weight: 400; }

    .content { padding: 18px 18px 32px; position: relative; z-index: 1; }

    .filterboard {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.8);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 18px;
      backdrop-filter: blur(8px);
    }
    .filter-row {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .filter-label {
      font-size: 12px; color: rgba(255,255,255,0.75); font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-right: 4px;
    }
    .filter-pill {
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 13px; color: #fff;
      cursor: pointer;
      transition: background 0.15s;
    }
    .filter-pill:hover, .filter-pill.active { background: #8658d1; border-color: #8658d1; }
    .filter-search {
      margin-left: auto;
      display: flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 8px;
      padding: 5px 12px;
    }
    .filter-search i { color: rgba(255,255,255,0.7); font-size: 15px; }
    .filter-search input {
      background: transparent; border: none; outline: none;
      color: #fff; font-size: 13px; width: 130px;
    }
    .filter-search input::placeholder { color: rgba(255,255,255,0.5); }

    .feed-grid { display: flex; flex-direction: column; gap: 14px; }

    .feed-card {
      background: rgba(255,255,255,0.13);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 16px;
      padding: 16px;
      backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
      transition: background 0.2s;
    }
    .feed-card:hover { background: rgba(255,255,255,0.2); }
    .feed-card::before {
      content: '';
      position: absolute;
      top: -30px; right: -30px;
      width: 130px; height: 130px;
      background: rgba(134,88,209,0.12);
      border-radius: 50%;
      pointer-events: none;
    }

    .card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .card-avatar {
      width: 38px; height: 38px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 500; color: #fff; flex-shrink: 0;
    }
    .card-meta { flex: 1; }
    .card-name { font-size: 14px; font-weight: 500; color: #fff; }
    .card-time { font-size: 12px; color: rgba(255,255,255,0.6); }
    .card-tag { font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 500; }
    .card-body { font-size: 14px; color: rgba(255,255,255,0.88); line-height: 1.6; margin-bottom: 12px; }
    .card-footer {
      display: flex; align-items: center; gap: 16px;
      border-top: 1px solid rgba(255,255,255,0.12);
      padding-top: 10px;
    }
    .card-action {
      display: flex; align-items: center; gap: 5px;
      font-size: 13px; color: rgba(255,255,255,0.65);
      cursor: pointer; transition: color 0.15s;
    }
    .card-action:hover { color: #fff; }
    .card-action i { font-size: 16px; }

    .art-layer {
      position: relative; margin-top: 20px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    }
    .art-box { border-radius: 18px; padding: 20px 18px; position: relative; overflow: hidden; }
    .art-box-1 { background: rgba(134,88,209,0.18); border: 1px solid rgba(134,88,209,0.4); box-shadow: 0 4px 32px rgba(134,88,209,0.15); }
    .art-box-2 { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); box-shadow: 0 4px 32px rgba(255,255,255,0.08); }
    .art-box-3 { background: rgba(120,162,179,0.22); border: 1px solid rgba(120,162,179,0.5); box-shadow: 0 4px 32px rgba(120,162,179,0.18); }
    .art-box-4 { background: rgba(134,88,209,0.1); border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 4px 32px rgba(134,88,209,0.1); }
    .art-box::after {
      content: '';
      position: absolute;
      bottom: -20px; left: -20px;
      width: 100px; height: 100px;
      background: rgba(255,255,255,0.06);
      border-radius: 50%;
    }
    .art-stat { font-size: 26px; font-weight: 500; color: #fff; margin-bottom: 4px; }
    .art-stat-label { font-size: 12px; color: rgba(255,255,255,0.65); }
    .art-icon { font-size: 22px; color: rgba(255,255,255,0.5); margin-bottom: 10px; }

    .section-title {
      font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.7);
      text-transform: uppercase; letter-spacing: 0.5px;
      margin: 20px 0 10px;
    }
  </style>
</head>
<body>

<div class="page">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <nav class="navbar">
    <div class="nav-left">
      <div class="hamburger-btn" id="hamburgerBtn">
        <i class="ti ti-menu-2"></i>
        <div class="dropdown-menu">
          <a href="#"><i class="ti ti-home"></i> Home</a>
          <a href="#"><i class="ti ti-chart-bar"></i> Analytics</a>
          <a href="#"><i class="ti ti-bookmark"></i> Saved</a>
          <a href="#"><i class="ti ti-users"></i> Community</a>
          <a href="#"><i class="ti ti-settings"></i> Settings</a>
          <a href="#"><i class="ti ti-help"></i> Help</a>
        </div>
      </div>
      <span class="nav-brand">Dashboard</span>
    </div>
    <div class="nav-right">
      <div class="notif-btn">
        </div>
        </div>

        </nav>
        </div>
        </body>
