    <script>


      let cartOpen = false;

document.getElementById("cartBtn").addEventListener("click", async function () {
  cartOpen = !cartOpen;
  const cartList = document.getElementById("cartList");
  const contents = document.getElementById("contents");

  if (cartOpen) {
    contents.classList.add("hidden");
    cartList.classList.remove("hidden");
    await loadCart();
  } else {
    contents.classList.remove("hidden");
    cartList.classList.add("hidden");
  }
});

async function loadCart() {
  const res = await fetch("/cartitems", { method: "GET" });
  const items = await res.json();
  renderCart(items);
}

function renderCart(items) {
  const list = document.getElementById("cartList");

  list.innerHTML = items.map(p => {
    let media = "";
    if (p.mediatype === "image") {
      media = `<img src="${p.imgurl}" class="w-full h-auto rounded-md">`;
    } else if (p.mediatype === "video") {
      media = `<video controls class="w-full h-auto rounded-md">
        <source src="${p.imgurl}" type="video/mp4">
      </video>`;
    }

    return `
      <div class="bg-white/20 rounded-md p-3 flex flex-col gap-2">
        ${p.text ? `<p>${p.text}</p>` : ""}
        ${media}
        <button class="removeCartBtn btn btn-sm btn-outline w-fit" data-postid="${p.postid}">
          Remove
        </button>
      </div>`;
  }).join("");

  document.querySelectorAll(".removeCartBtn").forEach(btn => {
    btn.addEventListener("click", async function () {
      const postid = this.dataset.postid;
      const res = await fetch("/removefromcart", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ postid })
      });
      if (res.ok) {
        loadCart();
      }
    });
  });
}
      document.getElementById("forcontent").addEventListener("submit", async function (e) {
  e.preventDefault();
  const formData = new FormData(this);
  const res = await fetch("/contentpost", { method: "POST", body: formData });
  if (res.ok) {
    this.reset();
   // loadposts();
  }
});
    async function postloader(){
       const res= await fetch('/post',{
            method:'GET'
        })
        const posts= await res.json();
        renderpost(posts);
     }


      function renderpost(post)
{
  const list = document.getElementById("contents");

  list.innerHTML = post.map(p => {
    let media = "";
    if (p.mediatype === "image") {
      media = `<img src="${p.imgurl}"  class="w-3/4 h-96 object-cover rounded-md">`;
    } else if (p.mediatype === "video") {
      media = `<video controls class="w-3/4 h-96 object-cover rounded-md">
        <source src="${p.imgurl}" type="video/mp4">
      </video>`;
    }
    let btn="";

    if(p.postcriteria === "sellerpost" ) {
      btn += `<button class="cartbtn" data-postid="${p.id}" class="btn btn-sm btn-outline w-fit" >add to cart
        </button>`;
    }

    return `

   
    <div class=" postui bg-white/20 rounded-md p-3 w-4/5 h-1/2 m-8 flex flex-col gap-2 items-center justify-center">
        ${p.username ? `<div class="border border-white/30 shadow shadow-lg rounded bg-black/30"><a href="/profile.html?userid=${p.userid}"><p>${p.username}</p></a></div>
`:""}
          <div id="tags" absolute left-5 class="grid grid-cols-5 gap-2 text-sm">
              <div id="postcriteria" class="bg-white/20 rounded border-black/20 shadow-lg"><p>${p.postcriteria}</p></div>
              <div id="artmedium" class="bg-white/20 rounded border-black/20 shadow-lg"><p>${p.artmedium}</p></div>
              <div id="vibe" class="bg-white/20 rounded border-black/20 shadow-lg"><p>${p.vibe}</p></div>
              <div id="keywords" class="bg-white/20 rounded border-black/20 shadow-lg"><p>${p.keywords}</p></div>
              </div>   
     
       
        ${p.text ? `<p>${p.text}</p>` : ""}
        ${media}
        <button class="interestBtn btn btn-sm btn-outline w-fit bg-white/30 border-black/70" data-postid="${p.id}">
          Interested
        </button>
        ${btn}
        <span class="text-xs opacity-60 bg-black/30 border-black/10">${p.timestamp}</span>
      </div>`;
  }).join("");

  document.querySelectorAll(".interestBtn").forEach(btn => {
    btn.addEventListener("click", async function () {
      const postid = this.dataset.postid;
      const res = await fetch("/interest", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ postid })
      });
      if (res.ok) {
        this.textContent = "Interested ✓";
        this.disabled = true;
      }
    });
  });
  document.querySelectorAll(".cartbtn").forEach(btn => {
    btn.addEventListener("click", async function () {
      const postid = this.dataset.postid;
      const res = await fetch("/addtocart", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ postid })
      });
      if (res.ok) {
        this.textContent = "added to cart";
        this.disabled = true;
      }
    });
  });
}
  postloader();
    </script>
