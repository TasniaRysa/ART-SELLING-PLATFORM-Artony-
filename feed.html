  <style>:root {

#mainfeed { border-radius: var(--radius-md); box-shadow: var(--shadow-high); }

#contents > div:hover, #cartList > div:hover { box-shadow: var(--shadow-mid); }</style>

<form

 class="input input-bordered  bg-white/20 text-sm transition-all duration-500 ease-in-out overflow-hidden rounded-lg max-w-0 opacity-0 p-0 border-0">

    <script>

      let csrfToken = null;
async function loadCsrfToken() {
  const res = await fetch("/csrf-token");
  const data = await res.json();
  csrfToken = data.csrfToken;
}
loadCsrfToken();


document.getElementById("logoutBtn").addEventListener("click", async function () {
  try {
    const res = await fetch("/logout", {
      method: "POST",
      headers: { "x-csrf-token": csrfToken }
    });
    if (res.ok) {
      window.location.href = "/index.html";
    }
  } catch (error) {
    console.error(error);
  }
});

      document.querySelector('select[name="postcriteria"]').addEventListener("change", function() {
  const sellerField = document.getElementById("sellerlocation");
  const price= document.getElementById("price");
  if (this.value === "seller") {
    sellerField.classList.remove("max-w-0", "opacity-0", "p-0", "border-0");
    sellerField.classList.add("max-w-xs", "opacity-100", "px-3", "py-1", "border");
     price.classList.remove("max-w-0", "opacity-0", "p-0", "border-0");
    price.classList.add("max-w-xs", "opacity-100", "px-3", "py-1", "border");
  } else {
    sellerField.classList.remove("max-w-xs", "opacity-100", "px-3", "py-1", "border");
    sellerField.classList.add("max-w-0", "opacity-0", "p-0", "border-0");
     price.classList.add("max-w-0", "opacity-0", "p-0", "border-0");
    price.classList.remove("max-w-xs", "opacity-100", "px-3", "py-1", "border");
  }
});
 


      let cartOpen = false;

document.getElementById("cartBtn").addEventListener("click", async function () {
  cartOpen = !cartOpen;
  const cartList = document.getElementById("cartList");
  const contents = document.getElementById("contents");

  if (cartOpen) {
    contents.classList.add("hidden");
    cartList.classList.remove("hidden");
    await loadCart();
  } else {
    contents.classList.remove("hidden");
    cartList.classList.add("hidden");
  }
});

async function loadCart() {
  const res = await fetch("/cartitems", { method: "GET" });
  const items = await res.json();
  renderCart(items);
}

function renderCart(items) {
  const list = document.getElementById("cartList");

  list.innerHTML = items.map(p => {
    let media = "";
    if (p.mediatype === "image") {
      media = `<img src="${p.imgurl}" class="w-full h-auto rounded-md">`;
    } else if (p.mediatype === "video") {
      media = `<video controls class="w-full h-auto rounded-md">
        <source src="${p.imgurl}" type="video/mp4">
      </video>`;
    }

    return `
      <div class="bg-white/20 rounded-md p-3 flex flex-col gap-2">
        ${p.text ? `<p>${p.text}</p>` : ""}
        ${media}
        <button class="removeCartBtn btn btn-sm btn-outline w-fit" data-postid="${p.postid}">
          Remove
        </button>
      </div>`;
  }).join("");

  document.querySelectorAll(".removeCartBtn").forEach(btn => {
    btn.addEventListener("click", async function () {
      const postid = this.dataset.postid;
      const res = await fetch("/removefromcart", {
        method: "POST",
        headers: {
  "Content-Type": "application/json",
  "x-csrf-token": csrfToken
},
        body: JSON.stringify({ postid })
      });
      if (res.ok) {
        loadCart();
      }
    });
  });
}


function loaddp(){
  fetch("/profile", { method: "GET" })
    .then(res => res.json())
    .then(data => {
     document.getElementById("navdp").src = data.dp;
    });
};
      document.getElementById("forcontent").addEventListener("submit", async function (e) {
  e.preventDefault();
  const formData = new FormData(this);
  const res = await fetch("/contentpost", { method: "POST",
  headers: {
  "Content-Type": "application/json",
  "x-csrf-token": csrfToken
},
   body: formData });
  if (res.ok) {
    this.reset();
   // loadposts();
  }
});
let masterPosts = [];
    async function postloader(){
       const res = await fetch('/post', { method: 'GET' });
       masterPosts = await res.json();
       renderpost(masterPosts);
    }

      function renderpost(post)
{
  const list = document.getElementById("contents");

  list.innerHTML = post.map(p => {
    let media = "";
    if (p.mediatype === "image") {
      media = `<img src="${p.imgurl}"  class="w-3/4 h-96 object-contain rounded-md">`;
    } else if (p.mediatype === "video") {
      media = `<video controls class="w-3/4 h-96 object-cover rounded-md">
        <source src="${p.imgurl}" type="video/mp4">
      </video>`;
    }
    let btn="";

    if(p.postcriteria === "seller" ) {
      btn += `<button class="cartbtn bg-white/50 border-black/50" data-postid="${p.id}" class="btn btn-sm btn-outline w-fit" >add to cart
        </button>`;
    }
    let priceTag = "";
    if (p.postcriteria === "seller" && p.price) {
      priceTag = `<span class="text-sm font-semibold bg-black/20 rounded px-2 py-1">৳ ${p.price}</span>`;
    }
    return `

   
    <div class=" postui bg-white/20 rounded-md p-3 w-4/5  m-8 flex flex-col gap-2 items-center justify-center">
       ${p.username ? `<div class="border border-white/30 shadow shadow-lg rounded bg-black/30 flex items-center gap-2 p-1">
  <a href="/profile.html?userid=${p.userid}" class="flex items-center gap-2">
    <img src="${p.dp || 'https://img.daisyui.com/images/profile/demo/yellingcat@192.webp'}" class="w-8 h-8 rounded-full object-cover">
    <p>${p.username}</p>
  </a>
</div>` : ""}
          <div id="tags" absolute left-5 class="grid grid-cols-5 gap-2 text-sm">
              <div id="postcriteria" class="bg-white/20 rounded border-black/20 shadow-lg"><p>${p.postcriteria}</p></div>
              <div id="artmedium" class="bg-white/20 rounded border-black/20 shadow-lg"><p>${p.artmedium}</p></div>
              <div id="vibe" class="bg-white/20 rounded border-black/20 shadow-lg"><p>${p.vibe}</p></div>
              <div id="keywords" class="bg-white/20 rounded border-black/20 shadow-lg"><p>${p.keywords}</p></div>
              </div>   
     
       
        ${p.text ? `<p>${p.text}</p>` : ""}
        ${media}
         ${priceTag}
        <button class="interestBtn btn btn-sm btn-outline w-fit bg-white/30 border-black/70" data-postid="${p.id}">
          Interested
        </button>
        ${btn}
        <span class="text-xs opacity-60 bg-black/30 border-black/10">${p.timestamp}</span>
      </div>`;
  }).join("");

  document.querySelectorAll(".interestBtn").forEach(btn => {
    btn.addEventListener("click", async function () {
      const postid = this.dataset.postid;
      const res = await fetch("/interest", {
        method: "POST",
        headers: {
  "Content-Type": "application/json",
  "x-csrf-token": csrfToken
},
        body: JSON.stringify({ postid })
      });
      if (res.ok) {
        this.textContent = "Interested ✓";
        this.disabled = true;
      }
    });
  });
  document.querySelectorAll(".cartbtn").forEach(btn => {
    btn.addEventListener("click", async function () {
      const postid = this.dataset.postid;
      const res = await fetch("/addtocart", {
        method: "POST",
        headers: {
  "Content-Type": "application/json",
  "x-csrf-token": csrfToken
},
        body: JSON.stringify({ postid })
      });
      if (res.ok) {
        this.textContent = "added to cart";
        this.disabled = true;
      }
    });
  });
}

function showFilterOptions(field) {
  const optionsBox = document.getElementById("filterOptions");
  const values = [...new Set(masterPosts.map(p => p[field]).filter(v => v))];

  optionsBox.classList.remove("hidden");
 
 // optionsBox.innerHTML += "existing criterias posted:";
  optionsBox.innerHTML = values.map(v =>
    `<button class="filterOptionBtn btn btn-xs btn-outline bg-white/30" data-field="${field}" data-value="${v}">${v}</button>`
  ).join("") + `<button id="clearFilter" class="btn btn-xs btn-outline bg-white/50">Clear filter</button>`;

  document.querySelectorAll(".filterOptionBtn").forEach(btn => {
    btn.addEventListener("click", function () {
      applyFilter(this.dataset.field, this.dataset.value);
    });
  });

  document.getElementById("clearFilter").addEventListener("click", () => {
    renderpost(masterPosts);
    optionsBox.classList.add("hidden");
  });
}

function applyFilter(field, value) {
  const filtered = masterPosts.filter(p => p[field] === value);
  renderpost(filtered);
}
document.getElementById("medium").addEventListener("click", () => showFilterOptions("artmedium"));
document.getElementById("key").addEventListener("click", () => showFilterOptions("keywords"));
document.getElementById("vibe").addEventListener("click", () => showFilterOptions("vibe"));
  postloader();
  loaddp();
    </script>
