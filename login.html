<!DOCTYPE html>
<html>
    <head>
        <title>login</title>
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Story+Script&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body>
      <div class="fixed inset-0 flex items-center justify-center m-20 border rounded border-white border-5 bg-white/10">
        <div class="h-72 w-72 shadow-lg">
        <h class="text-3xl m-5 border border-white bg-white/70 p-2 rounded">LOGIN</h>
        <br>
        <form action="/login" method="POST">
            <input type="hidden" name="x-csrf-token" id="csrfInput">
        <input type="text" placeholder="Username" name="username" class="border border-black m-5 p-2 rounded">
        <br>
        <input type="password" placeholder="Password" name="password" class="border border-black m-5 p-2 rounded">
        <br>
        <button class="border bg-white/75 border-black m-5 p-2 rounded">LOG IN</button>
        </form>
        </div>
    </div>
    <div class="grid grid-cols-2">
    <div>
    <div style="background-image: url('https://i.pinimg.com/1200x/8e/9c/1b/8e9c1b9596368d80c25d66691e86eda5.jpg');" class="bg-cover bg-center h-screen"> 
    
        
        
        </div>
        

       
        
    </div>
     
<div>
    <img src="https://i.pinimg.com/736x/c2/41/2b/c2412bd884ee89d3e3037cfd5ba20f3b.jpg" >
</div>
        </div>    
    </body>


    <script>
       
  fetch("/csrf-token")
    .then(res => res.json())
    .then(data => {
      document.getElementById("csrfInput").value = data.csrfToken;
    });

    </script>
    
    
</html>
