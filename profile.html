<script>
  let csrfToken = null;
async function loadCsrfToken() {
  const res = await fetch("/csrf-token");
  const data = await res.json();
  csrfToken = data.csrfToken;
}
loadCsrfToken();


document.getElementById("logoutBtn").addEventListener("click", async function () {
  try {
    const res = await fetch("/logout", {
      method: "POST",
      headers: { "x-csrf-token": csrfToken }
    });
    if (res.ok) {
      window.location.href = "/index.html";
    }
  } catch (error) {
    console.error(error);
  }
});

  const toggleBtn = document.getElementById("togglePostBox");
  const postBox = document.getElementById("postBox");

  let open = false;

  toggleBtn.addEventListener("click", () => {
    open = !open;

    if (open) {
      postBox.classList.remove("max-h-0");
      postBox.classList.add("max-h-[500px]");
    } else {
      postBox.classList.remove("max-h-[500px]");
      postBox.classList.add("max-h-0");
    }

  });

 

//loadProfile();
</script>
<script>

  
 
 async function loadprofile()
{
   const params = new URLSearchParams(window.location.search);
   const targetId = params.get("userid");

   const url = targetId ? `/profileget?userid=${targetId}` : "/profile";
   const res = await fetch(url,{
    method:"GET"
  })
 const data= await res.json();
 let {id,userid,username,bio,workinfo,preferences,links,dp}=data;
 workinfo=JSON.parse(workinfo);
  preferences=JSON.parse(preferences);
  links=JSON.parse(links);
 document.getElementById("name").textContent="  "+username;
document.getElementById("bio").textContent=bio;
document.getElementById("workinfo").innerHTML=workinfo.map(info=>`<li>${info}</li>`).join("");
document.getElementById("pref").innerHTML=preferences.map(info=>`<li>${info}</li>`).join("");
document.getElementById("links").innerHTML=links.map(info=>`<li>${info}</li>`).join("");
if (dp) {
  document.getElementById("dpimg").src = dp;
}
 }


 document.getElementById("forcontent").addEventListener("submit", async function (e) {
  e.preventDefault();
  const formData = new FormData(this);
  const res = await fetch("/contentpost", { method: "POST", headers: {
          "Content-Type": "application/json",
          "x-csrf-token": csrfToken
        },
         body: formData });
  if (res.ok) {
    this.reset();
    loadposts();
  }
});

 async function loadposts()
{
  const params = new URLSearchParams(window.location.search);
  const targetId = params.get("userid");

  const url = targetId ? `/showpost?userid=${targetId}` : "/showpost";
  const res = await fetch(url, {
    method:"GET"
  })

  let post = await res.json();
  renderpost(post);
}
  function renderpost(post)
{
  const list = document.getElementById("postList");

  list.innerHTML = post.map(p => {
    let media = "";
    if (p.mediatype === "image") {
      media = `<img src="${p.imgurl}" class="w-full h-96 object-contain rounded-md">`;
    } else if (p.mediatype === "video") {
      media = `<video controls class="w-full h-auto rounded-md">
        <source src="${p.imgurl}" type="video/mp4">
      </video>`;
    }

    let priceTag = "";
    if (p.postcriteria === "seller" && p.price) {
      priceTag = `<span class="text-sm font-semibold bg-black/20 rounded px-2 py-1">৳ ${p.price}</span>`;
    }

    return `
      <div class="bg-white/20 rounded-md p-3 flex flex-col gap-2">
        ${p.username ? `<div class="border border-black bg-black/50"><a href="/profile.html?userid=${p.userid}"><p>${p.username}</p></a></div>` : ""}
        ${p.text ? `<p>${p.text}</p>` : ""}
        ${media}
        ${priceTag}
        <button class="interestBtn btn btn-sm btn-outline w-fit" data-postid="${p.id}">
          Interested
        </button>
        <span class="text-xs opacity-60">${p.timestamp}</span>
      </div>`;
  }).join("");

  document.querySelectorAll(".interestBtn").forEach(btn => {
    btn.addEventListener("click", async function () {
      const postid = this.dataset.postid;
      const res = await fetch("/interest", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-csrf-token": csrfToken
        },
        body: JSON.stringify({ postid })
      });
      if (res.ok) {
        this.textContent = "Interested ✓";
        this.disabled = true;
      }
    });
  });
}

 

document.querySelector('select[name="postcriteria"]').addEventListener("change", function() {
  const sellerField = document.getElementById("sellerlocation");
  const price= document.getElementById("price");
  if (this.value === "sellerpost") {
    sellerField.classList.remove("max-w-0", "opacity-0", "p-0", "border-0");
    sellerField.classList.add("max-w-xs", "opacity-100", "px-3", "py-1", "border");
     price.classList.remove("max-w-0", "opacity-0", "p-0", "border-0");
    price.classList.add("max-w-xs", "opacity-100", "px-3", "py-1", "border");
  } else {
    sellerField.classList.remove("max-w-xs", "opacity-100", "px-3", "py-1", "border");
    sellerField.classList.add("max-w-0", "opacity-0", "p-0", "border-0");
     price.classList.add("max-w-0", "opacity-0", "p-0", "border-0");
    price.classList.remove("max-w-xs", "opacity-100", "px-3", "py-1", "border");
  }
});
 


 loadprofile();
 loadposts();
</script>
