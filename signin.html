<!DOCTYPE html>
<head>
        
        <title>sign in</title>
        <link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Story+Script&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>

    </head>
<body>
    <div class="fixed inset-0 rounded-md flex items-center justify-center m-10 border border-white border-5 bg-black/10 backdrop-blur-[1px]">
        <div class="h-72 w-72 shadow-lg rounded-md bg-white/30 flex flex-col items-center justify-center p-8 border border-white">
        <h1 class="text-3xl m-5">SIGNIN</h1>
        
        <form action="/submit" method="POST">
        <input type="text" placeholder="Username" name="username" class=" rounded-md border border-black m-5 p-2">
        
        <input type="password" placeholder="Password" name="password" class=" rounded-md border border-black m-5 p-2">
        
        <button type="submit" onclick="changewindow()" class="border bg-white/75 border-black m-5 p-2 rounded-md">SIGN IN</button>
        </form>
        </div>
    </div>
    <div class="grid grid-cols-2">
    <div>
    <div style="background-image: url('https://i.pinimg.com/1200x/8e/9c/1b/8e9c1b9596368d80c25d66691e86eda5.jpg');" class="bg-cover bg-center h-screen"> 
    
        
        
        </div>
        

       
        
    </div>
     
<div>

</div>
        </div>

       async function changewindow() {
            window.location.href = "form.html";
