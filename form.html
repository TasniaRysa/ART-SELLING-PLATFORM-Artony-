<!DOCTYPE html>
<head>

        <title>sign in form</title>
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Story+Script&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>

    </head>
<body class="bg-[#0e0d12] overflow-x-hidden">

    <!-- collage backdrop: two artworks side by side, full bleed -->
    <div class="grid grid-cols-2 h-screen w-screen fixed inset-0">
        <div style="background-image: url('https://i.pinimg.com/1200x/8e/9c/1b/8e9c1b9596368d80c25d66691e86eda5.jpg');" class="bg-cover bg-center h-full"></div>
        <img src="https://i.pinimg.com/736x/c2/41/2b/c2412bd884ee89d3e3037cfd5ba20f3b.jpg" class="w-full h-full object-cover">
    </div>
    <div class="fixed inset-0 bg-black/30 pointer-events-none"></div>

    <!-- gallery placard, pinned across the seam -->
    <div class="relative z-10 min-h-screen w-full flex items-center justify-center p-6">

        <div class="relative w-full max-w-lg rotate-[-1deg] shadow-2xl rounded-lg border border-white/40 bg-white/15 backdrop-blur-xl p-10 pt-16">

            <!-- polaroid-style photo tile, taped to the corner -->
            <div class="absolute -top-8 left-10 rotate-[-4deg]">
                <div id="dp" class="w-24 h-24 bg-white p-2 pb-5 shadow-lg cursor-pointer hover:brightness-95 transition flex items-center justify-center">
                    <input type="file" id="dpinput" accept="image/*" class="hidden">
                    <input type="hidden" id="dpUrl" name="dp" value="" form="profileForm">
                    <span class="text-[10px] text-black/50 text-center leading-tight">+ ADD<br>PHOTO</span>
                </div>
                <div class="w-10 h-4 bg-white/70 mx-auto -mt-1 rotate-2 shadow-sm"></div>
            </div>

            <div class="text-right">
                <span style="font-family:'Story Script', cursive;" class="text-white/80 text-2xl">artist profile</span>
            </div>

            <h1 class="text-white text-2xl font-serif tracking-wide mt-2 mb-1">Tell us about your work</h1>
            <p class="text-white/60 text-sm mb-6">A profile picture helps people recognize you on Artony.</p>

            <form id="profileForm" action="/profileinfo" method="POST" class="flex flex-col gap-3">

                <input type="text" placeholder="Bio" name="bio"
                    class="rounded-md border border-white/30 bg-white/10 text-white placeholder-white/50 p-2.5 focus:outline-none focus:border-white/70 transition">

                <div id="workinfocontainer" class="flex flex-col gap-2">
                    <div class="flex items-center gap-2">
                        <input type="text" placeholder="workinfo" name="workinfo[]"
                            class="flex-1 rounded-md border border-white/30 bg-white/10 text-white placeholder-white/50 p-2.5 focus:outline-none focus:border-white/70 transition">
                        <button type="button" id="moreworkinfo"
                            class="w-9 h-9 rounded-md border border-white/30 text-white hover:bg-white/20 transition" style="background-color: rgba(159,154,179,0.5);">+</button>
                    </div>
                </div>

                <div id="prefcontainer" class="flex flex-col gap-2">
                    <div class="flex items-center gap-2">
                        <input type="text" placeholder="art preferences" name="preferences[]"
                            class="flex-1 rounded-md border border-white/30 bg-white/10 text-white placeholder-white/50 p-2.5 focus:outline-none focus:border-white/70 transition">
                        <button type="button" id="morepref"
                            class="w-9 h-9 rounded-md border border-white/30 text-white hover:bg-white/20 transition" style="background-color: rgba(159,154,179,0.5);">+</button>
                    </div>
                </div>

                <div id="linkcontainer" class="flex flex-col gap-2">
                    <div class="flex items-center gap-2">
                        <input type="text" placeholder="links" name="links[]"
                            class="flex-1 rounded-md border border-white/30 bg-white/10 text-white placeholder-white/50 p-2.5 focus:outline-none focus:border-white/70 transition">
                        <button type="button" id="morelink"
                            class="w-9 h-9 rounded-md border border-white/30 text-white hover:bg-white/20 transition" style="background-color: rgba(159,154,179,0.5);">+</button>
                    </div>
                </div>

                <button type="submit" onclick="changewindow()"
                    class="mt-3 rounded-md p-2.5 text-white shadow-lg hover:brightness-110 transition" style="background-color: rgb(159,154,179);">SIGN IN</button>
            </form>

            <a href="/skipform" class="block text-center text-white/50 text-xs mt-4 hover:text-white/80 transition">Don't show this again</a>
        </div>
    </div>

     <script>

        function changewindow() {
            window.location.href = "form.html";
        }


        document.getElementById("dp").addEventListener("click",()=>{
            document.getElementById("dpinput").click();
        });

       document.getElementById("dpinput").addEventListener("change", async (event) => {
    const file = document.getElementById("dpinput").files[0];
    if (!file) return;

    //document.getElementById("dpinput").src = URL.createObjectURL(file);

    const formData = new FormData();
    formData.append("dp", file);

    const res = await fetch("/upload", { method: "POST", body: formData });
    const data = await res.json();

    document.getElementById("dpUrl").value = data.imgurl;
});

        document.getElementById("moreworkinfo").addEventListener("click",()=>{
            const container=document.getElementById(("workinfocontainer"));
            const newInput=document.createElement("input");
            newInput.type="text";
            newInput.placeholder="workinfo";
            newInput.name="workinfo";
            container.appendChild(newInput);
            container.appendChild(document.createElement("br"));
            container.appendChild(document.createElement("br"));

        })

        document.getElementById("morepref").addEventListener("click",()=>{
            const container=document.getElementById(("prefcontainer"));
            const newInput=document.createElement("input");
            newInput.type="text";
            newInput.placeholder="art preferences";
            newInput.name="preferences";
            container.appendChild(newInput);
            container.appendChild(document.createElement("br"));
            container.appendChild(document.createElement("br"));})


             document.getElementById("morelink").addEventListener("click",()=>{
            const container=document.getElementById(("linkcontainer"));
            const newInput=document.createElement("input");
            newInput.type="text";
            newInput.placeholder="links";
            newInput.name="links";
            container.appendChild(newInput);
            container.appendChild(document.createElement("br"));
            container.appendChild(document.createElement("br"));

        }
    )
     </script>

</body>
